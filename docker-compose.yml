services:
  db:
    image: postgres:15-alpine
    container_name: shoestore_db
    restart: always
    environment:
      POSTGRES_DB: shoe_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shoe_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./shoe-store-backend
      dockerfile: Dockerfile
    container_name: shoestore_backend
    restart: always
    environment:
      DB_URL: ${DB_URL:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_NAME: shoe_shop
      PORT: 8000
      JWT_SECRET: shoe-shop-jwt-secret-key-12345
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./shoe-store-frontend
      dockerfile: Dockerfile
    container_name: shoestore_frontend
    restart: always
    environment:
      API_BASE: /api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
