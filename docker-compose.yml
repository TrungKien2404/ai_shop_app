services:
  db:
    image: postgres:15-alpine
    container_name: shoestore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoe_shop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "${DB_PORT_FORWARD:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shoe_shop}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./shoe-store-backend
      dockerfile: Dockerfile
    container_name: shoestore_backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      DB_NAME: ${POSTGRES_DB:-shoe_shop}
      PORT: ${BACKEND_PORT:-8000}
      JWT_SECRET: ${JWT_SECRET:-shoe-shop-dev-secret}
      AUTO_SEED: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./shoe-store-frontend
      dockerfile: Dockerfile
    container_name: shoestore_frontend
    restart: unless-stopped
    environment:
      API_BASE: ${API_BASE:-/api}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
